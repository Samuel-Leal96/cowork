<div class="glass flex flex-col h-[600px] rounded-xl bg-[#181b28]/70 backdrop-blur-md border border-[#ffffff0d] overflow-hidden animate-fade-in [animation-delay:400ms]">
  <div class="flex items-center gap-3 p-4 border-b border-[#ffffff0d] bg-black/20">
    <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold bg-[#25d366]/20 text-[#25d366]">FE</div>
    <div>
      <h4 class="m-0 text-white font-medium">Cowork Bot</h4>
      <span class="text-xs text-[#25d366] flex items-center gap-1">
        <span class="text-[8px]">●</span> En línea
      </span>
    </div>
  </div>
  
  <div #messagesContainer class="flex-1 overflow-y-auto p-5 flex flex-col gap-4">
    @for (msg of messages(); track msg.id) {
      <div class="flex w-full" [ngClass]="msg.sender === 'user' ? 'justify-end' : 'justify-start'">
        <div 
          class="max-w-[80%] p-3 rounded-2xl text-[0.9rem] leading-relaxed whitespace-pre-wrap"
          [ngClass]="msg.sender === 'user' ? 'bg-[#005c4b] text-white rounded-br-sm' : 'bg-[#202c33] text-gray-200 rounded-bl-sm'"
        >
          {{msg.text}}
        </div>
      </div>
    }
  </div>

  <form class="p-3 bg-[#202c33] border-t border-[#ffffff0d] flex gap-2" (submit)="handleSend($event)">
    <input 
      type="text" 
      [ngModel]="inputValue()"
      (ngModelChange)="inputValue.set($event)"
      name="messageInput"
      placeholder="Escribe un mensaje..."
      class="flex-1 bg-[#2a3942] border-none rounded-full px-4 py-2 text-white focus:outline-none focus:ring-1 focus:ring-[#00a884] placeholder-gray-400"
    />
    <button 
      type="submit" 
      class="w-10 h-10 rounded-full bg-[#00a884] flex items-center justify-center text-white border-none cursor-pointer hover:bg-[#008f6f] transition-colors flex-shrink-0"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </form>
</div>
