<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 mb-6 md:mb-8">
  <div class="glass flex items-center p-3 md:p-5 rounded-xl animate-fade-in [animation-delay:0s] bg-[#181b28]/70 backdrop-blur-md border border-[#ffffff0d]">
    <div class="w-10 h-10 md:w-12 md:h-12 rounded-lg flex items-center justify-center text-xl md:text-2xl mr-3 md:mr-4 bg-fuchsia-500/15 text-fuchsia-400">
      📱
    </div>
    <div class="flex-1">
      <p class="text-xs md:text-sm text-gray-400 mb-1">Órdenes Totales</p>
      <h3 class="text-xl md:text-2xl font-bold text-white m-0">{{ orderService.stats().totalOrders }}</h3>
    </div>
  </div>

  <div class="glass flex items-center p-3 md:p-5 rounded-xl animate-fade-in [animation-delay:100ms] bg-[#181b28]/70 backdrop-blur-md border border-[#ffffff0d]">
    <div class="w-10 h-10 md:w-12 md:h-12 rounded-lg flex items-center justify-center text-xl md:text-2xl mr-3 md:mr-4 bg-emerald-500/15 text-emerald-400">
      💰
    </div>
    <div class="flex-1 flex flex-col items-start">
      <select 
        class="bg-transparent border-none text-xs md:text-sm text-gray-400 p-0 mb-1 focus:ring-0 cursor-pointer w-full"
        [ngModel]="incomeType()"
        (ngModelChange)="incomeType.set($event)"
      >
        <option class="bg-[#181b28]" value="Pendiente">Ingresos Pendientes</option>
        <option class="bg-[#181b28]" value="Pagado">Ingresos Pagados</option>
      </select>
      <h3 class="text-xl md:text-2xl font-bold text-white m-0">${{ displayIncome() | number:'1.0-0' }}</h3>
    </div>
  </div>

  <div class="glass flex items-center p-3 md:p-5 rounded-xl animate-fade-in [animation-delay:200ms] bg-[#181b28]/70 backdrop-blur-md border border-[#ffffff0d] sm:col-span-2 md:col-span-1">
    <div class="w-10 h-10 md:w-12 md:h-12 rounded-lg flex items-center justify-center text-xl md:text-2xl mr-3 md:mr-4 bg-blue-500/15 text-blue-400">
      ✨
    </div>
    <div class="flex-1">
      <p class="text-xs md:text-sm text-gray-400 mb-1">Órdenes de Hoy</p>
      <h3 class="text-xl md:text-2xl font-bold text-white m-0">{{ orderService.stats().todayOrders }}</h3>
    </div>
  </div>
</div>
